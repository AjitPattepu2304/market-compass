services:
  - type: web
    name: market-compass-llm
    runtime: docker
    dockerfilePath: ./market-compass-llm/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: PORT
        value: 8081
