spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketcompass}
    username: ${DB_USERNAME:marketcompass}
    password: ${DB_PASSWORD:marketcompass}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
