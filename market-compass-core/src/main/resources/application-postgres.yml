spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketcompass}
    username: ${DB_USERNAME:marketcompass}
    password: ${DB_PASSWORD:marketcompass}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
