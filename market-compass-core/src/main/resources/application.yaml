spring:
  application:
    name: market-compass
  datasource:
    url: jdbc:h2:mem:marketcompass;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  task:
    scheduling:
      pool:
        size: 2

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

finnhub:
  api:
    key: ${FINNHUB_API_KEY:}
