services:
  postgres:
    image: postgres:17-alpine
    container_name: marketcompass-postgres
    environment:
      POSTGRES_DB: marketcompass
      POSTGRES_USER: marketcompass
      POSTGRES_PASSWORD: marketcompass
    ports:
      - "5432:5432"
    volumes:
      - marketcompass-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketcompass -d marketcompass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marketcompass-postgres:
