spring:
  application:
    name: market-compass-llm
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2:3b}
      embedding:
        model: nomic-embed-text
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${PORT:8081}
  servlet:
    context-path: /

whisper:
  binary: ${WHISPER_BINARY:/opt/homebrew/bin/whisper-cli}
  model: ${WHISPER_MODEL:/opt/homebrew/share/whisper-cpp/ggml-base.en.bin}

logging:
  level:
    com.marketcompass: DEBUG
    org.springframework.ai: INFO
