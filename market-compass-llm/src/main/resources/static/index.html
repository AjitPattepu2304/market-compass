<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0d0d0d;
      color: #c9c9c9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 80px;
    }

    .header { text-align: center; margin-bottom: 40px; }
    .header h1 { font-size: 22px; font-weight: 600; color: #e0e0e0; letter-spacing: -0.3px; }
    .header p  { font-size: 13px; color: #4a4a4a; margin-top: 6px; }
    .dot {
      display: inline-block; width: 7px; height: 7px;
      border-radius: 50%; background: #2a6b4a;
      margin-right: 8px; vertical-align: middle;
    }

    /* ── Setup ── */
    #setup { width: 100%; max-width: 680px; }

    .card {
      width: 100%; max-width: 680px;
      background: #141414; border: 1px solid #1f1f1f;
      border-radius: 14px; padding: 20px 24px; margin-bottom: 14px;
    }
    .card-label {
      font-size: 10px; font-weight: 500; text-transform: uppercase;
      letter-spacing: 1.4px; color: #3a3a3a; margin-bottom: 12px;
    }
    textarea {
      width: 100%; background: #0d0d0d; border: 1px solid #1e1e1e;
      border-radius: 8px; color: #b0b0b0; font-size: 13.5px;
      line-height: 1.7; padding: 12px 14px; resize: vertical;
      min-height: 110px; font-family: inherit; transition: border-color 0.2s;
    }
    textarea:focus { outline: none; border-color: #2a4a3a; }
    textarea::placeholder { color: #2e2e2e; }

    .btn-primary {
      width: 100%; max-width: 680px; padding: 13px;
      background: #1a3a2a; color: #5aad7a; border: 1px solid #1f4a34;
      border-radius: 10px; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: background 0.2s, color 0.2s;
      margin-bottom: 14px; font-family: inherit;
    }
    .btn-primary:hover { background: #1f4a34; color: #6abf8a; }
    .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Interview ── */
    #interview { display: none; width: 100%; max-width: 680px; flex-direction: column; align-items: center; }

    .session-bar {
      width: 100%; display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 20px;
    }
    .badge {
      display: inline-block; background: #1a3a2a; color: #3a7a5a;
      font-size: 10px; font-weight: 500; padding: 2px 8px;
      border-radius: 4px; letter-spacing: 0.5px; margin-left: 8px;
    }
    .btn-reset {
      background: none; border: 1px solid #1e1e1e; color: #3a3a3a;
      border-radius: 8px; padding: 8px 16px; font-size: 12px;
      cursor: pointer; font-family: inherit; transition: color 0.2s, border-color 0.2s;
    }
    .btn-reset:hover { color: #666; border-color: #333; }

    /* ── Controls ── */
    .controls { display: flex; gap: 10px; width: 100%; max-width: 680px; margin-bottom: 8px; }
    .btn-record {
      flex: 1; padding: 13px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 500; cursor: pointer;
      font-family: inherit; transition: opacity 0.2s, background 0.2s;
    }
    .btn-record:disabled { opacity: 0.25; cursor: not-allowed; }
    #startBtn { background: #1a3a2a; color: #5aad7a; border: 1px solid #1f4a34; }
    #startBtn:not(:disabled):hover { background: #1f4a34; }
    #stopBtn  { background: #3a1a1a; color: #ad5a5a; border: 1px solid #4a1f1f; }
    #stopBtn:not(:disabled):hover  { background: #4a1f1f; }

    .status {
      font-size: 12px; color: #3a3a3a; height: 16px;
      margin-bottom: 14px; width: 100%; max-width: 680px;
    }
    .status.active { color: #4a7a5a; }
    .status.done   { color: #3a6a4a; }
    .status.error  { color: #7a3a3a; }

    /* ── Conversation thread ── */
    #thread { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 14px; }

    .turn { width: 100%; }

    .turn-question {
      background: #111; border: 1px solid #1a1a1a;
      border-radius: 10px 10px 0 0; padding: 12px 16px;
      font-size: 12px; color: #5a7a6a; border-bottom: none;
    }
    .turn-question span { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #2e4a3a; margin-right: 8px; }

    .turn-answer {
      background: #141414; border: 1px solid #1f1f1f;
      border-radius: 0 0 10px 10px; padding: 18px 20px;
    }

    /* ── Markdown rendered content ── */
    .md-body { font-size: 14px; line-height: 1.8; color: #b8b8b8; }
    .md-body p  { margin-bottom: 10px; }
    .md-body p:last-child { margin-bottom: 0; }
    .md-body ul, .md-body ol { padding-left: 20px; margin-bottom: 10px; }
    .md-body li { margin-bottom: 4px; }
    .md-body strong { color: #d0d0d0; font-weight: 600; }
    .md-body em { color: #9a9a9a; }
    .md-body h1, .md-body h2, .md-body h3 {
      color: #d0d0d0; font-weight: 600; margin: 14px 0 8px;
    }
    .md-body h1 { font-size: 16px; }
    .md-body h2 { font-size: 15px; }
    .md-body h3 { font-size: 14px; }
    .md-body code {
      background: #1a1a1a; color: #7abf9a;
      padding: 2px 6px; border-radius: 4px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12.5px;
    }
    .md-body pre {
      background: #111; border: 1px solid #1e1e1e;
      border-radius: 8px; padding: 14px 16px;
      overflow-x: auto; margin: 10px 0;
    }
    .md-body pre code {
      background: none; color: inherit; padding: 0;
      font-size: 13px; line-height: 1.6;
    }
    .md-body blockquote {
      border-left: 3px solid #2a4a3a; padding-left: 12px;
      color: #6a6a6a; margin: 10px 0;
    }
    .md-body table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
    .md-body th, .md-body td { border: 1px solid #1e1e1e; padding: 8px 12px; text-align: left; }
    .md-body th { background: #1a1a1a; color: #d0d0d0; }

    /* ── Thinking placeholder ── */
    .thinking { color: #2e4a3a; font-size: 13px; font-style: italic; }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(90, 173, 122, 0.15); }
      70%  { box-shadow: 0 0 0 10px rgba(90, 173, 122, 0); }
      100% { box-shadow: 0 0 0 0 rgba(90, 173, 122, 0); }
    }
    .recording { animation: pulse-ring 1.4s infinite; }
  </style>
</head>
<body>

  <div class="header">
    <h1><span class="dot"></span>Interview Assistant</h1>
    <p>Speak naturally — get answers tailored to your resume</p>
  </div>

  <!-- ── Setup ── -->
  <div id="setup">
    <div class="card">
      <div class="card-label">Job Description</div>
      <textarea id="jdInput" placeholder="Paste the job description..."></textarea>
    </div>
    <div class="card">
      <div class="card-label">Your Resume</div>
      <textarea id="resumeInput" placeholder="Paste your resume..."></textarea>
    </div>
    <button class="btn-primary" id="setupBtn">Begin Session →</button>
  </div>

  <!-- ── Interview ── -->
  <div id="interview">
    <div class="session-bar">
      <span style="font-size:12px;color:#3a3a3a;">Session active <span class="badge">context loaded</span></span>
      <button class="btn-reset" id="resetBtn">↩ Change context</button>
    </div>

    <div class="controls">
      <button class="btn-record" id="startBtn">▶ &nbsp;Record</button>
      <button class="btn-record" id="stopBtn" disabled>⏹ &nbsp;Stop &amp; Answer</button>
    </div>

    <div class="status" id="status"></div>

    <div id="thread"></div>
  </div>

  <script>
    marked.setOptions({
      highlight: (code, lang) => {
        if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
        return hljs.highlightAuto(code).value;
      },
      breaks: true,
      gfm: true
    });

    let mediaRecorder, chunks = [];

    const setupDiv     = document.getElementById('setup');
    const interviewDiv = document.getElementById('interview');
    const setupBtn     = document.getElementById('setupBtn');
    const startBtn     = document.getElementById('startBtn');
    const stopBtn      = document.getElementById('stopBtn');
    const resetBtn     = document.getElementById('resetBtn');
    const statusEl     = document.getElementById('status');
    const thread       = document.getElementById('thread');

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + type;
    }

    function addTurn(question, answerHtml, pending = false) {
      const turn = document.createElement('div');
      turn.className = 'turn';
      turn.innerHTML = `
        <div class="turn-question"><span>Q</span>${escapeHtml(question)}</div>
        <div class="turn-answer">
          <div class="md-body ${pending ? 'thinking' : ''}" id="answer-${Date.now()}">
            ${pending ? 'Thinking...' : answerHtml}
          </div>
        </div>`;
      thread.appendChild(turn);
      turn.scrollIntoView({ behavior: 'smooth', block: 'end' });
      return turn.querySelector('.md-body');
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    setupBtn.onclick = async () => {
      const jd     = document.getElementById('jdInput').value.trim();
      const resume = document.getElementById('resumeInput').value.trim();
      if (!jd && !resume) { alert('Paste at least a job description or resume.'); return; }
      setupBtn.disabled = true;
      setupBtn.textContent = 'Setting up...';
      const res = await fetch('/api/stt/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jobDescription: jd, resume })
      });
      if (res.ok) {
        thread.innerHTML = '';
        setupDiv.style.display = 'none';
        interviewDiv.style.display = 'flex';
      } else {
        setupBtn.disabled = false;
        setupBtn.textContent = 'Begin Session →';
        alert('Setup failed. Try again.');
      }
    };

    resetBtn.onclick = async () => {
      await fetch('/api/stt/reset-history', { method: 'POST' });
      interviewDiv.style.display = 'none';
      setupDiv.style.display = 'block';
      setupBtn.disabled = false;
      setupBtn.textContent = 'Begin Session →';
      thread.innerHTML = '';
    };

    startBtn.onclick = async () => {
      try {
        chunks = [];
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = sendAudio;
        mediaRecorder.start();
        startBtn.disabled = true;
        stopBtn.disabled = false;
        stopBtn.classList.add('recording');
        setStatus('● Recording...', 'active');
      } catch {
        setStatus('Microphone access denied', 'error');
      }
    };

    stopBtn.onclick = () => {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
      stopBtn.disabled = true;
      stopBtn.classList.remove('recording');
      setStatus('Transcribing...', 'active');
    };

    async function sendAudio() {
      const blob = new Blob(chunks, { type: 'audio/webm' });
      const form = new FormData();
      form.append('audio', blob, 'recording.webm');

      // placeholder turn while waiting
      const placeholder = addTurn('…', '', true);

      try {
        const res = await fetch('/api/stt/ask', { method: 'POST', body: form });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        const question = data.transcript || '(empty)';
        const answerHtml = marked.parse(data.answer || '(no answer)');

        // update placeholder with real content
        placeholder.closest('.turn').querySelector('.turn-question').innerHTML =
          `<span>Q</span>${escapeHtml(question)}`;
        placeholder.classList.remove('thinking');
        placeholder.innerHTML = answerHtml;
        hljs.highlightAll();

        setStatus('Done — record again to continue', 'done');
        startBtn.disabled = false;
      } catch (err) {
        placeholder.classList.remove('thinking');
        placeholder.innerHTML = `<span style="color:#7a3a3a">Error: ${err.message}</span>`;
        setStatus('Error — try again', 'error');
        startBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
